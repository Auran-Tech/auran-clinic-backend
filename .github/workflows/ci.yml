name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Auran.Clinic.sln

      - name: Build
        run: dotnet build Auran.Clinic.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Auran.Clinic.sln --configuration Release --no-build --verbosity normal

      - name: Publish API
        run: dotnet publish src/Auran.Clinic.Api/Auran.Clinic.Api.csproj --configuration Release --no-build --output ./artifacts/api
