name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Auran_CI_Password_123!
        ports:
          - 1433:1433

    env:
      ConnectionStrings__DefaultConnection: Server=localhost,1433;Database=AuranClinicCi;User Id=sa;Password=Auran_CI_Password_123!;TrustServerCertificate=True;Encrypt=False
      Jwt__SigningKey: Auran_CI_Only_JWT_Signing_Key_Not_A_Secret_2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Auran.Clinic.sln

      - name: Build
        run: dotnet build Auran.Clinic.sln --configuration Release --no-restore

      - name: Generate pending EF migration
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set +e
          dotnet ef migrations has-pending-model-changes \
            --project src/Auran.Clinic.Infrastructure/Auran.Clinic.Infrastructure.csproj \
            --startup-project src/Auran.Clinic.Api/Auran.Clinic.Api.csproj \
            --configuration Release \
            --no-build
          pending_status=$?
          set -e

          if [ "$pending_status" -eq 0 ]; then
            echo "No pending EF model changes."
            exit 0
          fi

          dotnet ef migrations add BusinessAccountState \
            --project src/Auran.Clinic.Infrastructure/Auran.Clinic.Infrastructure.csproj \
            --startup-project src/Auran.Clinic.Api/Auran.Clinic.Api.csproj \
            --configuration Release \
            --no-build \
            --output-dir Persistence/Migrations

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Auran.Clinic.Infrastructure/Persistence/Migrations

          if git diff --cached --quiet; then
            echo "Migration generation produced no repository changes."
            exit 0
          fi

          git commit -m "db: add business account state migration"
          git push origin HEAD:${{ github.head_ref }}

      - name: Apply migrations to SQL Server
        shell: bash
        run: |
          for attempt in {1..30}; do
            if dotnet ef database update \
              --project src/Auran.Clinic.Infrastructure/Auran.Clinic.Infrastructure.csproj \
              --startup-project src/Auran.Clinic.Api/Auran.Clinic.Api.csproj \
              --configuration Release \
              --no-build; then
              exit 0
            fi

            echo "SQL Server not ready yet (attempt ${attempt}/30)."
            sleep 2
          done

          echo "Database migration failed after all retries."
          exit 1

      - name: Verify EF model matches migrations
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Auran.Clinic.Infrastructure/Auran.Clinic.Infrastructure.csproj
          --startup-project src/Auran.Clinic.Api/Auran.Clinic.Api.csproj
          --configuration Release
          --no-build

      - name: Test
        run: dotnet test Auran.Clinic.sln --configuration Release --no-build --verbosity normal

      - name: Publish API
        run: dotnet publish src/Auran.Clinic.Api/Auran.Clinic.Api.csproj --configuration Release --no-build --output ./artifacts/api
