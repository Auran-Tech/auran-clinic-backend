name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Auran_CI_Password_123!
        ports:
          - 1433:1433

    env:
      ASPNETCORE_ENVIRONMENT: Development
      AURAN_SQL_INTEGRATION: "true"
      Jwt__SigningKey: Auran_CI_Signing_Key_For_Tests_Only_2026_Change_Me
      ConnectionStrings__DefaultConnection: Server=localhost,1433;Database=AuranClinicCi;User Id=sa;Password=Auran_CI_Password_123!;TrustServerCertificate=True;Encrypt=False

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Auran.Clinic.sln

      - name: Build
        run: dotnet build Auran.Clinic.sln --configuration Release --no-restore

      - name: Apply migrations to SQL Server
        shell: bash
        run: |
          for attempt in {1..30}; do
            if dotnet ef database update \
              --project src/Auran.Clinic.Infrastructure/Auran.Clinic.Infrastructure.csproj \
              --startup-project src/Auran.Clinic.Api/Auran.Clinic.Api.csproj \
              --configuration Release \
              --no-build; then
              exit 0
            fi

            echo "SQL Server not ready yet (attempt ${attempt}/30)."
            sleep 2
          done

          echo "Database migration failed after all retries."
          exit 1

      - name: Verify EF model matches migrations
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Auran.Clinic.Infrastructure/Auran.Clinic.Infrastructure.csproj
          --startup-project src/Auran.Clinic.Api/Auran.Clinic.Api.csproj
          --configuration Release
          --no-build

      - name: Test
        run: dotnet test Auran.Clinic.sln --configuration Release --no-build --verbosity normal

      - name: Publish API
        run: dotnet publish src/Auran.Clinic.Api/Auran.Clinic.Api.csproj --configuration Release --no-build --output ./artifacts/api
