name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__SigningKey: Auran_CI_Signing_Key_For_Tests_Only_2026_Change_Me
      ConnectionStrings__DefaultConnection: Server=localhost;Database=AuranClinicCi;User Id=sa;Password=Auran_CI_Password_123!;TrustServerCertificate=True

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Auran.Clinic.sln

      - name: Build
        run: dotnet build Auran.Clinic.sln --configuration Release --no-restore

      - name: Generate foundation hardening migration
        shell: bash
        run: |
          if compgen -G "src/Auran.Clinic.Infrastructure/Persistence/Migrations/*_FoundationHardening.cs" > /dev/null; then
            echo "FoundationHardening migration already exists."
          else
            dotnet ef migrations add FoundationHardening \
              --project src/Auran.Clinic.Infrastructure/Auran.Clinic.Infrastructure.csproj \
              --startup-project src/Auran.Clinic.Api/Auran.Clinic.Api.csproj \
              --output-dir Persistence/Migrations
          fi

      - name: Commit generated migration
        shell: bash
        run: |
          git add src/Auran.Clinic.Infrastructure/Persistence/Migrations
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "db: add foundation hardening migration"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Test
        run: dotnet test Auran.Clinic.sln --configuration Release --no-build --verbosity normal

      - name: Publish API
        run: dotnet publish src/Auran.Clinic.Api/Auran.Clinic.Api.csproj --configuration Release --no-build --output ./artifacts/api
