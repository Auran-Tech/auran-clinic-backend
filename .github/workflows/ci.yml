name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Auran_CI_Password_123!
        ports:
          - 1433:1433

    env:
      ConnectionStrings__DefaultConnection: Server=localhost,1433;Database=AuranClinicCi;User Id=sa;Password=Auran_CI_Password_123!;TrustServerCertificate=True;Encrypt=False
      Jwt__SigningKey: Auran_CI_Only_JWT_Signing_Key_Not_A_Secret_2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate production configuration preflight
        shell: bash
        run: |
          bash -n scripts/production-preflight.sh
          if ASPNETCORE_ENVIRONMENT=Production Jwt__SigningKey=short \
             FileStorage__RootPath=/srv/auran/uploads Cors__AllowedOrigins__0=https://clinic.example.invalid \
             bash scripts/production-preflight.sh; then
            echo "Preflight must fail when the signing key is unsafe"
            exit 1
          fi
          ASPNETCORE_ENVIRONMENT=Production \
          FileStorage__RootPath=/srv/auran/uploads \
          Cors__AllowedOrigins__0=https://clinic.example.invalid \
          bash scripts/production-preflight.sh

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Auran.Clinic.sln

      - name: Build with warnings as errors
        run: dotnet build Auran.Clinic.sln --configuration Release --no-restore -warnaserror

      - name: Apply migrations to SQL Server
        shell: bash
        run: |
          for attempt in {1..30}; do
            if dotnet ef database update \
              --project src/Auran.Clinic.Infrastructure/Auran.Clinic.Infrastructure.csproj \
              --startup-project src/Auran.Clinic.Api/Auran.Clinic.Api.csproj \
              --configuration Release \
              --no-build; then
              exit 0
            fi

            echo "SQL Server not ready yet (attempt ${attempt}/30)."
            sleep 2
          done

          echo "Database migration failed after all retries."
          exit 1

      - name: Verify EF model matches migrations
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Auran.Clinic.Infrastructure/Auran.Clinic.Infrastructure.csproj
          --startup-project src/Auran.Clinic.Api/Auran.Clinic.Api.csproj
          --configuration Release
          --no-build

      - name: Unit tests
        run: dotnet test tests/Auran.Clinic.UnitTests/Auran.Clinic.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Integration tests
        run: dotnet test tests/Auran.Clinic.IntegrationTests/Auran.Clinic.IntegrationTests.csproj --configuration Release --no-build --verbosity normal

      - name: Publish API
        run: dotnet publish src/Auran.Clinic.Api/Auran.Clinic.Api.csproj --configuration Release --no-build --output ./artifacts/api

      - name: Hosted API and SQL readiness smoke
        shell: bash
        env:
          ASPNETCORE_URLS: http://127.0.0.1:5085
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          set -euo pipefail
          (cd ./artifacts/api && dotnet Auran.Clinic.Api.dll) > /tmp/auran-clinic-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat /tmp/auran-clinic-api.log' EXIT
          for attempt in {1..40}; do
            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "API exited before becoming ready"
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:5085/health/ready > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:5085/health/live > /dev/null
          curl --fail --silent http://127.0.0.1:5085/health/ready > /dev/null
          code=$(curl --silent --output /tmp/unauthorized-patients.json --write-out '%{http_code}' \
            http://127.0.0.1:5085/api/patients)
          test "$code" = "401"
