name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__SigningKey: Auran_CI_Signing_Key_For_Tests_Only_2026_Change_Me
      ConnectionStrings__DefaultConnection: Server=localhost;Database=AuranClinicCi;User Id=sa;Password=Auran_CI_Password_123!;TrustServerCertificate=True

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Auran.Clinic.sln

      - name: Build
        run: dotnet build Auran.Clinic.sln --configuration Release --no-restore

      - name: Generate foundation hardening migration
        run: dotnet ef migrations add FoundationHardening --project src/Auran.Clinic.Infrastructure/Auran.Clinic.Infrastructure.csproj --startup-project src/Auran.Clinic.Api/Auran.Clinic.Api.csproj --output-dir Persistence/Migrations

      - name: Upload generated migrations
        uses: actions/upload-artifact@v4
        with:
          name: generated-foundation-hardening-migration
          path: src/Auran.Clinic.Infrastructure/Persistence/Migrations
          if-no-files-found: error

      - name: Test
        run: dotnet test Auran.Clinic.sln --configuration Release --no-build --verbosity normal

      - name: Publish API
        run: dotnet publish src/Auran.Clinic.Api/Auran.Clinic.Api.csproj --configuration Release --no-build --output ./artifacts/api
